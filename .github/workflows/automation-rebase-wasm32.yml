name: Temporary rebase and validate feat-wasm32

on:
  push:
    branches:
      - automation/rebase-feat-wasm32-20260904

permissions:
  contents: write

concurrency:
  group: rebase-feat-wasm32-20260904
  cancel-in-progress: false

jobs:
  rebase-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/wasm32
          fetch-depth: 0
          persist-credentials: true

      - name: Install current stable Go bootstrap
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Rebase, validate, and force-push with lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/automation/rebase-feat-wasm32-20260904:refs/remotes/origin/automation/rebase-feat-wasm32-20260904
          git show origin/automation/rebase-feat-wasm32-20260904:.github/scripts/rebase-wasm32.sh > /tmp/rebase-wasm32.sh
          python3 <<'PY'
          from pathlib import Path

          p = Path('/tmp/rebase-wasm32.sh')
          text = p.read_text()

          def replace_exact(old: str, new: str, label: str, expected: int = 1) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'failed to patch {label}: found {count}, expected {expected}')
              text = text.replace(old, new)

          replace_exact(
              '''if git rev-parse -q --verify REBASE_HEAD >/dev/null 2>&1; then
            echo "Rebase state remains unexpectedly" >&2
            exit 5
          fi''',
              '''if [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; then
            echo "Rebase state remains unexpectedly" >&2
            exit 5
          fi''',
              'rebase-state check',
          )

          replace_exact(
              '''# Regenerate from the rebased generators. This both validates the generators and
          # catches stale generated files after upstream's gentools migration.
          (
            cd src/simd/archsimd
            env GO111MODULE=off GOPATH="$GITHUB_WORKSPACE" go generate -tags=goexperiment.simd
          )
          git diff --binary > "$REVIEW_DIR/generator-diff-before-amend.patch"
          git diff --check
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Generated outputs changed; amending the final SIMD commit."
            git add -A
            GIT_EDITOR=true git commit --amend --no-edit
          fi

          # Build the new toolchain, then exercise both the compiler plumbing and wasm32.
          ./src/make.bash
          ./bin/go version''',
              '''# Build the rebased tree before testing it. The current upstream aggregate
          # SIMD generator also requires external XED and ARM ISA datasets; those are
          # unrelated to this wasm-only conflict, so validate the affected generated
          # outputs structurally and through compiler/runtime tests instead.
          (cd src && ./make.bash)
          ./bin/go version
          test ! -e src/simd/archsimd/types_wasm.go
          test ! -e src/simd/archsimd/ops_wasm.go
          grep -Fq '//go:build goexperiment.simd && (wasm || wasm32)' src/simd/archsimd/types_wasmx.go
          grep -Fq '//go:build goexperiment.simd && (wasm || wasm32)' src/simd/archsimd/ops_wasmx.go
          grep -Fq 'intrinsics.add(sys.ArchWasm32' src/cmd/compile/internal/ssagen/ssa.go
          : > "$REVIEW_DIR/generator-diff-before-amend.patch"''',
              'build and targeted generated-output validation',
          )

          p.write_text(text)
          PY
          bash /tmp/rebase-wasm32.sh

      - name: Export review material after a failed validation
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/wasm32-review/commits
          if git rev-parse --verify upstream/master >/dev/null 2>&1; then
            git log --reverse --format='%H%x09%P%x09%aI%x09%s' upstream/master..HEAD > /tmp/wasm32-review/commits.tsv || true
            git diff --stat upstream/master...HEAD > /tmp/wasm32-review/diff-stat.txt || true
            git diff --name-status -M upstream/master...HEAD > /tmp/wasm32-review/changed-files.txt || true
            git diff --binary upstream/master...HEAD > /tmp/wasm32-review/series.patch || true
            i=0
            while IFS=$'\t' read -r sha parents authored subject; do
              i=$((i + 1))
              safe_subject=$(printf '%s' "$subject" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//')
              printf -v n '%02d' "$i"
              git show --format=fuller --find-renames --find-copies --stat --patch "$sha" > "/tmp/wasm32-review/commits/${n}-${sha:0:12}-${safe_subject}.patch" || true
            done < /tmp/wasm32-review/commits.tsv
          fi

      - name: Upload complete review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feat-wasm32-rebased-review
          path: /tmp/wasm32-review
          if-no-files-found: warn
          retention-days: 7
