name: Temporary diagnose wasm32 after review fixups

on:
  push:
    branches:
      - automation/rebase-feat-wasm32-20260904

permissions:
  contents: read

concurrency:
  group: diagnose-feat-wasm32-20260904
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out rebased feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/wasm32
          fetch-depth: 1

      - name: Install current stable Go bootstrap
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Apply review-only x/sys/cpu fixups and diagnose
        shell: bash
        env:
          EXPECTED_HEAD: 104cb8ce40214e711c00ea336cbfc700c93c0283
          OUT: /tmp/wasm32-diagnostic
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          exec > >(tee "$OUT/workflow.log") 2>&1
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          python3 <<'PY'
          from pathlib import Path

          p = Path('src/vendor/golang.org/x/sys/cpu/cpu_wasm.go')
          s = p.read_text()
          assert s.count('//go:build wasm') == 1
          p.write_text(s.replace('//go:build wasm', '//go:build wasm || wasm32'))

          p = Path('src/vendor/golang.org/x/sys/cpu/endian_little.go')
          s = p.read_text()
          old = ' || sh || wasm'
          assert s.count(old) == 1
          p.write_text(s.replace(old, ' || sh || wasm || wasm32'))

          p = Path('src/vendor/golang.org/x/sys/cpu/byteorder.go')
          s = p.read_text()
          old = '\t\t"sh":\n\t\treturn littleEndian{}'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '\t\t"sh", "wasm", "wasm32":\n\t\treturn littleEndian{}'))
          PY

          git diff -- src/vendor/golang.org/x/sys/cpu | tee "$OUT/review-fix.patch"
          (cd src && ./make.bash)
          ./bin/go version | tee "$OUT/go-version.txt"

          run_soft() {
            name=$1
            shift
            echo "=== $name ==="
            set +e
            "$@" > "$OUT/$name.log" 2>&1
            status=$?
            set -e
            echo "$name=$status" | tee -a "$OUT/status.env"
            tail -n 100 "$OUT/$name.log" || true
          }

          run_soft build-js-wasm32 env GOEXPERIMENT=simd GOOS=js GOARCH=wasm32 ./bin/go build std
          run_soft build-wasip1-wasm32 env GOEXPERIMENT=simd GOOS=wasip1 GOARCH=wasm32 ./bin/go build std

          run_soft vet-js-wasm32 env GOEXPERIMENT=simd GOOS=js GOARCH=wasm32 ./bin/go vet internal/bytealg reflect runtime
          run_soft vet-wasip1-wasm32 env GOEXPERIMENT=simd GOOS=wasip1 GOARCH=wasm32 ./bin/go vet internal/bytealg reflect runtime

          run_soft test-js-bytealg env GOEXPERIMENT=simd GOOS=js GOARCH=wasm32 ./bin/go test -timeout=20m -exec="$PWD/lib/wasm/go_js_wasm32_exec" internal/bytealg
          run_soft test-js-reflect env GOEXPERIMENT=simd GOOS=js GOARCH=wasm32 ./bin/go test -timeout=20m -exec="$PWD/lib/wasm/go_js_wasm32_exec" reflect
          run_soft test-js-runtime env GOEXPERIMENT=simd GOOS=js GOARCH=wasm32 ./bin/go test -timeout=20m -exec="$PWD/lib/wasm/go_js_wasm32_exec" runtime
          run_soft test-js-simd env GOEXPERIMENT=simd GOOS=js GOARCH=wasm32 ./bin/go test -timeout=20m -exec="$PWD/lib/wasm/go_js_wasm32_exec" simd/archsimd

          run_soft compile-wasi-runtime env GOEXPERIMENT=simd GOOS=wasip1 GOARCH=wasm32 ./bin/go test -c runtime -o /tmp/runtime-wasip1-wasm32.test
          run_soft compile-wasi-simd env GOEXPERIMENT=simd GOOS=wasip1 GOARCH=wasm32 ./bin/go test -c simd/archsimd -o /tmp/simd-wasip1-wasm32.test

          git status --short | tee "$OUT/git-status.txt"

      - name: Upload diagnostic material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feat-wasm32-post-xsys-diagnostic
          path: /tmp/wasm32-diagnostic
          if-no-files-found: warn
          retention-days: 7
