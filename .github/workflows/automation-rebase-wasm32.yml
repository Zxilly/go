name: Temporary rebase and validate feat-wasm32

on:
  push:
    branches:
      - automation/rebase-feat-wasm32-20260904

permissions:
  contents: write

concurrency:
  group: rebase-feat-wasm32-20260904
  cancel-in-progress: false

jobs:
  rebase-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/wasm32
          fetch-depth: 0
          persist-credentials: true

      - name: Install current stable Go bootstrap
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Rebase, validate, and force-push with lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/automation/rebase-feat-wasm32-20260904:refs/remotes/origin/automation/rebase-feat-wasm32-20260904
          git show origin/automation/rebase-feat-wasm32-20260904:.github/scripts/rebase-wasm32.sh > /tmp/rebase-wasm32.sh
          python3 <<'PY'
          from pathlib import Path
          p = Path('/tmp/rebase-wasm32.sh')
          text = p.read_text()
          old = '''if git rev-parse -q --verify REBASE_HEAD >/dev/null 2>&1; then
            echo "Rebase state remains unexpectedly" >&2
            exit 5
          fi'''
          new = '''if [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; then
            echo "Rebase state remains unexpectedly" >&2
            exit 5
          fi'''
          if text.count(old) != 1:
              raise SystemExit('failed to patch rebase-state check')
          p.write_text(text.replace(old, new))
          PY
          bash /tmp/rebase-wasm32.sh

      - name: Upload complete review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feat-wasm32-rebased-review
          path: /tmp/wasm32-review
          if-no-files-found: warn
          retention-days: 7
